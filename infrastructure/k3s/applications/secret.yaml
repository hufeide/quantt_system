# 示例密钥，**生产必须替换**。
#
# 生成方式：
#   kubectl -n quant-app create secret generic quant-secret \
#     --from-literal=QUANT_MONGO_URI='mongodb://quant:<pwd>@mongodb.quant-data.svc.cluster.local:27017/?authSource=admin' \
#     --from-literal=QUANT_RABBITMQ_URL='amqp://quant:<pwd>@rabbitmq.quant-mq.svc.cluster.local:5672//' \
#     --from-literal=QUANT_CELERY_BROKER_URL='amqp://quant:<pwd>@rabbitmq.quant-mq.svc.cluster.local:5672//' \
#     --from-literal=QUANT_REDIS_URL='redis://redis.quant-mq.svc.cluster.local:6379/0' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 注意：Secret 只是 base64 编码，不是加密；不要把真实密码提交进 git。
apiVersion: v1
kind: Secret
metadata:
  name: quant-secret
  namespace: quant-app
  labels:
    app.kubernetes.io/part-of: quant-replay
type: Opaque
stringData:
  QUANT_MONGO_URI: "mongodb://quant:REPLACE_ME_MONGO_PASSWORD@mongodb.quant-data.svc.cluster.local:27017/?authSource=admin"
  QUANT_RABBITMQ_URL: "amqp://quant:REPLACE_ME_RABBITMQ_PASSWORD@rabbitmq.quant-mq.svc.cluster.local:5672//"
  QUANT_CELERY_BROKER_URL: "amqp://quant:REPLACE_ME_RABBITMQ_PASSWORD@rabbitmq.quant-mq.svc.cluster.local:5672//"
  QUANT_REDIS_URL: "redis://:REPLACE_ME_REDIS_PASSWORD@redis.quant-mq.svc.cluster.local:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: quant-secret
  namespace: quant-core
  labels:
    app.kubernetes.io/part-of: quant-replay
type: Opaque
stringData:
  QUANT_MONGO_URI: "mongodb://quant:REPLACE_ME_MONGO_PASSWORD@mongodb.quant-data.svc.cluster.local:27017/?authSource=admin"
  QUANT_RABBITMQ_URL: "amqp://quant:REPLACE_ME_RABBITMQ_PASSWORD@rabbitmq.quant-mq.svc.cluster.local:5672//"
  QUANT_CELERY_BROKER_URL: "amqp://quant:REPLACE_ME_RABBITMQ_PASSWORD@rabbitmq.quant-mq.svc.cluster.local:5672//"
  QUANT_REDIS_URL: "redis://:REPLACE_ME_REDIS_PASSWORD@redis.quant-mq.svc.cluster.local:6379/0"
  # apps/worker/celery_app.py 直接读无前缀 CELERY_BROKER_URL，这里一并注入
  CELERY_BROKER_URL: "amqp://quant:REPLACE_ME_RABBITMQ_PASSWORD@rabbitmq.quant-mq.svc.cluster.local:5672//"
---
# 数据库自身的初始化账号
apiVersion: v1
kind: Secret
metadata:
  name: quant-db-secret
  namespace: quant-data
  labels:
    app.kubernetes.io/part-of: quant-replay
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "quant"
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE_ME_MONGO_PASSWORD"
  MONGO_INITDB_DATABASE: "quant"
---
apiVersion: v1
kind: Secret
metadata:
  name: quant-mq-secret
  namespace: quant-mq
  labels:
    app.kubernetes.io/part-of: quant-replay
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "quant"
  RABBITMQ_DEFAULT_PASS: "REPLACE_ME_RABBITMQ_PASSWORD"
  REDIS_PASSWORD: "REPLACE_ME_REDIS_PASSWORD"
