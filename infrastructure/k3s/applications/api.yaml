# FastAPI 业务服务
#
# 镜像构建：docker build -f infrastructure/docker/Dockerfile.api -t quant-replay-api:1.0.0 .
# 导入 K3s：bash scripts/import_images.sh
# 生产请把 ghcr.io/quant-replay 换成你自己的 GitHub 用户 / 组织名。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: quant-app
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: quant-replay
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        # 让 Prometheus 通过注解发现需要抓取的 Pod（也可用静态配置，二者选一）
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/quant-replay/quant-replay-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: quant-config
            - secretRef:
                name: quant-secret
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            # 单机内存预算：FastAPI + Web 合计 1~2Gi（见 方案.md 第十章）
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quant-data
        - name: tmp
          emptyDir: {}
      # API 是入口，优先保证能调度
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: quant-app
  labels:
    app: api
    app.kubernetes.io/part-of: quant-replay
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
