# 独立运行的 Prometheus 配置（本地 / Docker Compose / 直接在 WSL2 里跑）
#
# 与 infrastructure/k3s/monitoring/prometheus.yaml 里的 ConfigMap 区别：
#   - 这里用静态 targets，适合 api / worker 跑在 docker 网络或宿主机上
#   - K3s 里用 kubernetes_sd_configs 按 Pod 注解自动发现
# 两处的告警规则都来自 alerts.yml，不要各写一份。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: quant-local
    environment: dev

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # FastAPI（本地 uvicorn 或 compose 里的 api 服务）
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
          namespace: quant-app

  # Celery worker 的指标端点（apps.worker 里起在 9108）
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9108"]
        labels:
          service: backtest-worker
          namespace: quant-core

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
