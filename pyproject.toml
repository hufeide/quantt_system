[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-replay"
version = "1.0.0"
description = "Single-node minute-level quant replay & backtest system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "celery>=5.4",
    "kombu>=5.3",
    "pymongo>=4.7",
    "streamlit>=1.36",
    "plotly>=5.22",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = [
    "core",
    "core.market",
    "core.replay",
    "core.strategy",
    "core.matching",
    "core.account",
    "core.risk",
    "core.factor",
    "core.event",
    "core.backtest",
    "core.storage",
    "data",
    "data.ingestion",
    "data.normalization",
    "data.validation",
    "data.storage",
    "apps",
    "apps.api",
    "apps.worker",
    "apps.web",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are handled by the formatter / review
    "UP035",  # typing.List etc. are still fine in this codebase
    "UP037",  # quoted annotations are used deliberately for forward refs
    "B008",   # function calls in argument defaults (FastAPI Depends)
    "UP042",  # str-Enum mixins are intentional for JSON friendliness
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
